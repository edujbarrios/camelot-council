name: Bug report
description: Report a reproducible problem in Camelot Council.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Camelot Council sturdier.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, files, or Codex invocation if relevant.
      placeholder: |
        1. Run `/roundtable ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, Codex environment, and repository version if known.
  - type: textarea
    id: context
    attributes:
      label: Additional context
